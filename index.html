<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1e40af">
<meta name="description" content="Monthly budget planning and tracking for the Mongkol Borei 2 Community Engagement and Sponsorship Plan, FY27.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Budget FY27">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="styles.css">
<title>Budget Monitor · Mongkol Borei 2 · FY27</title>
</head>
<body>
<div class="app">
  <aside class="side" id="side"></aside>
  <div class="main">
    <header class="top">
      <h1 id="ttl">Dashboard</h1>
      <select class="in" id="mp" aria-label="Select month" data-c="mi"></select>
      <button class="btn p" data-a="add"><svg class="ic" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span class="t">Add expense</span></button>
    </header>
    <main id="view"></main>
  </div>
  <nav class="tabbar" id="tabs" aria-label="Main"></nav>
</div>

<dialog id="dlg" aria-labelledby="dt">
  <form id="frm" novalidate>
    <h2 id="dt">Add expense</h2>
    <div class="f2">
      <label>Date<input class="in" type="date" id="fd" required></label>
      <label>Amount (USD)<input class="in" type="number" id="fm" step="0.01" min="0" inputmode="decimal" placeholder="0.00" required></label>
    </div>
    <label>Activity <span class="mu" style="font-weight:400">(type a code or name; leave empty for support costs)</span>
      <input class="in" id="fa" list="alist" autocomplete="off" placeholder="e.g. 40.01.09"></label>
    <datalist id="alist"></datalist>
    <label>Expense account (T2)<select class="in" id="ft"></select></label>
    <label>Description<input class="in" id="fx" maxlength="120" placeholder="What was this for?"></label>
    <label>Voucher / reference no.<input class="in" id="fr" maxlength="40"></label>
    <div class="err" id="fe" role="alert"></div>
    <div class="acts"><button type="button" class="btn" data-a="close">Cancel</button><button class="btn p">Save</button></div>
  </form>
</dialog>
<input type="file" id="rf" accept=".json,application/json" hidden>
<div id="toast" aria-live="polite"></div>
<noscript>This app needs JavaScript.</noscript>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
